[workspace]
resolver = "2"
members = ["crates/teleocr", "crates/teleocr-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rzafiamy/teleocr-rs"
keywords = ["ocr", "candle", "document-parsing", "vlm", "gguf"]
categories = ["computer-vision", "science"]

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }
tracing = "0.1"
memmap2 = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
