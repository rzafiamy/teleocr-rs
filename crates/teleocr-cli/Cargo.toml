[package]
name = "teleocr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and HTTP server for TeleOCR"

[[bin]]
name = "teleocr"
path = "src/main.rs"

[features]
default = ["pdf"]
pdf = ["dep:pdfium-render"]
cuda = ["teleocr/cuda", "candle-core/cuda"]
metal = ["teleocr/metal", "candle-core/metal"]

[dependencies]
teleocr = { path = "../teleocr" }
candle-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tracing.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
multer = "3"
futures-util = "0.3"
pdfium-render = { version = "0.9", optional = true, default-features = false, features = ["pdfium_latest", "thread_safe"] }
